aid: deblock
name: Deblock
description: >-
  Deblock is a fintech company offering a hybrid financial app that combines a
  fully licensed current account with a French IBAN and a Visa debit card
  alongside a self-custodial (non-custodial) crypto wallet, so customers hold
  their own private keys while spending fiat and crypto in everyday life. Founded
  by former Revolut and Ledger team members and registered with France's AMF as a
  digital-asset service provider, Deblock lets users buy, sell and swap crypto
  through an integrated exchange, earn interest on their current account balance,
  and round spare change up into Bitcoin. Its consumer product is delivered as a
  mobile app under the tagline "Own Your Money"; Deblock does not currently
  publish a public developer API, portal, or documentation. This profile was
  added to the API Evangelist network from the Speedinvest venture portfolio.
